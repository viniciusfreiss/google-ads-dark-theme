<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 220px;
      padding: 20px;
      background-color: #1d2226;
      color: #ffffff;
      font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      text-align: center;
    }

    h3 {
      margin: 0 0 15px 0;
      font-size: 16px;
      font-weight: 600;
      color: #e1e9f1;
    }

    .toggle-container {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }

    .toggle-container input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #43474a;
      transition: .3s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked+.slider {
      background-color: #70b5f9;
    }

    input:focus+.slider {
      box-shadow: 0 0 1px #2196F3;
    }

    input:checked+.slider:before {
      transform: translateX(24px);
    }

    .status {
      margin-top: 12px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #70b5f9;
    }
  </style>
</head>

<body>
  <h3>Ads Dark Mode</h3>
  <label class="toggle-container">
    <input type="checkbox" id="themeToggle">
    <span class="slider"></span>
  </label>
  <div class="status" id="statusText">...</div>
  <script src="popup.js"></script>
</body>

</html>
